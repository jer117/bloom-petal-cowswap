schema = "bloom.petal.build.v1"
name = "cowswap"
routes = "route/files"
output = "petal/cowswap"

[route_crate]
package = "bloom-cowswap-route"
path = "route"
alias = "cowswap_route"

[dependencies]
alloy = { version = "2", default-features = false, features = ["dyn-abi", "k256", "serde", "sol-types", "std"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
